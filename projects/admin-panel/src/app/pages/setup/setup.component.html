<div class="auth-saas-page setup-container">
  <div class="glass-card setup-card">
    <div class="brand">
      <div class="brand-icon">N</div>
      <span class="brand-text">Nextou</span>
    </div>

    @if (isLoading) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Verifying system status...</p>
    </div>
    } @if (!isLoading) {
    <div>
      <h1 class="title">Initial System Setup</h1>
      <p class="subtitle">
        Create the primary superuser account to open the admin workspace.
      </p>
      @if (errorMsg) {
      <div class="alert alert-danger">
        <i class="fi fi-rr-exclamation"></i>
        <span>{{ errorMsg }}</span>
      </div>
      }
      <form [formGroup]="setupForm" (ngSubmit)="onSubmit()" class="setup-form">
        <div class="form-group">
          <label for="setup-email">Email address</label>
          <input
            type="email"
            formControlName="email"
            id="setup-email"
            class="form-control"
            placeholder="admin@example.com"
          />
        </div>
        <div class="form-group">
          <label for="setup-username">Username</label>
          <input
            type="text"
            formControlName="username"
            id="setup-username"
            class="form-control"
            placeholder="admin"
          />
        </div>
        <div class="form-group">
          <label for="setup-password">Password</label>
          <input
            type="password"
            formControlName="password"
            id="setup-password"
            class="form-control"
            placeholder="Secure password (min 8 chars)"
          />
        </div>
        <button
          type="submit"
          class="btn btn-primary btn-block"
          [disabled]="setupForm.invalid || isSubmitting"
        >
          @if (isSubmitting) {
          <span class="spinner-small"></span>
          }
          {{ isSubmitting ? "Creating account..." : "Create Superuser" }}
        </button>
      </form>
    </div>
    }
  </div>
</div>
