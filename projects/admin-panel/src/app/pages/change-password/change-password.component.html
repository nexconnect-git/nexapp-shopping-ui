<div class="saas-page change-pw-page">
  <div class="change-pw-card">
    <div class="brand">
      <span class="material-icons-outlined brand-icon"
        >admin_panel_settings</span
      >
      <span class="brand-name">Nextou</span>
    </div>

    <div class="lock-icon">
      <span class="material-icons-outlined">lock_reset</span>
    </div>

    <h1 class="title">Change password</h1>
    <p class="subtitle">
      Choose a strong password to keep your admin account secure.
    </p>

    @if (success()) {
    <div class="success-msg">
      <span class="material-icons-outlined">check_circle</span>
      Password updated! Redirecting to dashboard…
    </div>
    } @else {
    <form class="form" (ngSubmit)="onSubmit()">
      @if (error()) {
      <div class="error-banner">{{ error() }}</div>
      }

      <div class="field">
        <label class="label" for="admin-current-password">Current password</label>
        <input
          class="input"
          type="password"
          [(ngModel)]="currentPassword"
          name="currentPassword"
          id="admin-current-password"
          placeholder="Enter your current password"
          autocomplete="current-password"
          required
        />
      </div>

      <div class="field">
        <label class="label" for="admin-new-password">New password</label>
        <input
          class="input"
          type="password"
          [(ngModel)]="newPassword"
          name="newPassword"
          id="admin-new-password"
          placeholder="At least 8 characters"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="field">
        <label class="label" for="admin-confirm-password">Confirm new password</label>
        <input
          class="input"
          type="password"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          id="admin-confirm-password"
          placeholder="Repeat new password"
          autocomplete="new-password"
          required
        />
      </div>

      <button class="btn-submit" type="submit" [disabled]="!canSubmit()">
        @if (loading()) {
        <span class="spinner"></span> Updating… } @else {
        <span class="material-icons-outlined">lock</span> Update password }
      </button>
    </form>
    }

    <button class="btn-logout" (click)="logout()">
      <span class="material-icons-outlined">logout</span>
      Sign Out
    </button>
  </div>
</div>
