@if(error()){<p class="admin-error" role="alert">{{error()}}<button class="btn btn-secondary" (click)="refresh()">Retry</button></p>}
@if (profileConfig()) {
  <nc-dynamic-profile-page
    [config]="profileConfig()!"
    (action)="handleAction($event)"
    (editSection)="editSection($event)"
  />
}

<app-profile-context entityType="admin-user" [entityId]="auth.user()?.id || ''" />
