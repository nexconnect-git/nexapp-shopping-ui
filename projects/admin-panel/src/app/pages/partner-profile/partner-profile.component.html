<div class="saas-page partner-profile-page">
  @if (loading()) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading delivery partner...</p>
    </div>
  } @else if (dynamicProfileConfig()) {
    <nc-dynamic-profile-page
      [config]="dynamicProfileConfig()!"
      (action)="handleDynamicAction($event)"
      (editSection)="editDynamicSection($event)"
    />
  }
</div>
