<div class="saas-page onboarding-page">
  <section class="onboarding-hero">
    <div>
      <span class="page-eyebrow">Admin Panel</span>
      <h1 class="page-title">{{ pageTitle }}</h1>
      <p class="page-subtitle">{{ pageSubtitle }}</p>
    </div>
  </section>

  @if (loading()) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading data...</p>
    </div>
  }

  @if (!loading()) {
    <app-dynamic-stepper
      [config]="stepperConfig"
      [loading]="saving()"
      [serverErrors]="errors()"
      [success]="success()"
      [prefillData]="prefillData()"
      [isEditMode]="mode === 'vendor-edit'"
      [uniqueChecker]="uniqueChecker"
      successMessage="Done!"
      [successSubmessage]="
        mode === 'vendor-edit'
          ? 'Returning to vendor profile...'
          : 'Redirecting...'
      "
      (submitForm)="onSubmit($event)"
      (stepperCancel)="onCancel()"
    />
  }
</div>
