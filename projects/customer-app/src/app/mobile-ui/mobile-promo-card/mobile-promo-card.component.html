<article class="mobile-promo-card">
  <div>
    <small>{{ eyebrow }}</small>
    <h2>{{ title }}</h2>
    @if (subtitle) {
      <p>{{ subtitle }}</p>
    }
    @if (cta && link) {
      <a [routerLink]="link">{{ cta }}</a>
    }
  </div>
  @if (image) {
    <img [src]="image" [alt]="title" />
  } @else {
    <span class="material-symbols-rounded">{{ icon }}</span>
  }
</article>
