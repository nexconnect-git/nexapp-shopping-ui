<header class="mobile-topbar">
  <div class="brand-row">
    @if (showBack()) {
      <button type="button" class="back-btn" aria-label="Go back" (click)="goBack()">
        <span class="material-symbols-rounded">arrow_back</span>
      </button>
    }
    <a routerLink="/" class="brand" aria-label="Nextou home">
      <img
        class="brand-logo"
        src="nextou-logo-single.png"
        alt=""
        aria-hidden="true"
      />
      <span class="brand-wordmark">Nextou</span>
    </a>
    <div class="top-actions">
      @if (canUseRoute("/cart")) {
        <button type="button" aria-label="Open cart" (click)="openCart()">
          <span class="material-symbols-rounded">shopping_bag</span>
          @if (state.itemCount()) {
            <i>{{ state.itemCount() }}</i>
          }
        </button>
      }
    </div>
  </div>

  @if (isHomeRoute()) {
    <button type="button" class="location-card" (click)="ui.openLocation()">
      <span class="material-symbols-rounded loc-icon">location_on</span>
      <span>
        <small class="delivering-label">
          <span class="live-pulse"></span>
          Delivering to
        </small>
        <b>{{ state.location() || 'Select location' }}</b>
      </span>
      <span class="material-symbols-rounded">expand_more</span>
    </button>
  }

  @if (isHomeRoute()) {
    @if (canUseRoute("/explore")) {
      <form class="search-card" (submit)="search($event)">
        <span class="material-symbols-rounded">search</span>
        <input
          type="search"
          name="q"
          [placeholder]="activePlaceholder()"
          [value]="query()"
          (input)="query.set($any($event.target).value)"
        />
      </form>
    }
  }
</header>
