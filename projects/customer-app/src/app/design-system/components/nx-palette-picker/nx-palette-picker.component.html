<div class="nxpp">
  <p class="nxpp__label">Accent Color</p>
  <div class="nxpp__swatches">
    @for (p of palettes; track p.id) {
      <button
        type="button"
        class="nxpp__swatch"
        [class.nxpp__swatch--active]="theme.palette() === p.id"
        [style.background]="p.hex"
        [title]="p.label"
        (click)="selectPalette(p.id)"
        [attr.aria-label]="p.label"
      >
        @if (theme.palette() === p.id) {
          <span class="material-icons-outlined nxpp__check">check</span>
        }
      </button>
    }
  </div>

  <p class="nxpp__label">Appearance</p>
  <div class="nxpp__modes">
    @for (m of MODES; track m.id) {
      <button
        type="button"
        class="nxpp__mode"
        [class.nxpp__mode--active]="theme.mode() === m.id"
        (click)="selectMode(m.id)"
      >
        <span class="material-icons-outlined">{{ m.icon }}</span>
        {{ m.label }}
      </button>
    }
  </div>
</div>
