<article class="store-card">
  <a [routerLink]="['/store', store.id]" class="store-img">
    <img
      [src]="store.image || placeholderImage"
      [alt]="storeName()"
      loading="lazy"
      (error)="onImageError($event)"
    />
    <span class="eta-badge">
      <span class="material-symbols-rounded">bolt</span>
      {{ etaLabel() }}
    </span>
    @if (store.offer) {
      <span class="offer-badge">{{ store.offer }}</span>
    }
  </a>
  <div class="info">
    <small class="category">{{ store.category || "Store" }}</small>
    <a [routerLink]="['/store', store.id]" class="name">{{ storeName() }}</a>
    <div class="meta-row">
      <span><span class="material-symbols-rounded">star</span>{{ ratingLabel() }}</span>
      <span><span class="material-symbols-rounded">near_me</span>{{ store.distance || "Nearby" }}</span>
    </div>
    <div class="status-row">
      <span
        class="status-pill"
        [class.open]="isStoreOpen()"
        [class.closed]="!isStoreOpen()"
      >
        {{ storeStatusText() }}
      </span>
      <small>{{ ratingsCountLabel() }} ratings</small>
    </div>
  </div>
</article>
