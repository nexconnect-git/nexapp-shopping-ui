<article class="store-card">
  <a [routerLink]="['/store', store.id]" class="store-cover"
    ><img
      [src]="store.image || placeholderImage"
      [alt]="storeName()"
      loading="lazy"
      (error)="onImageError($event)"
    /><span class="tag" [class.green]="isStoreOpen()" [class.warning]="!isStoreOpen()"><svg customerIcon="clock"></svg>{{
      storeStatusText()
    }}</span></a
  >
  <div class="store-card-body">
    <div class="row between"><a [routerLink]="['/store',store.id]"><h3>{{ storeName() }}</h3></a><a class="btn text" [routerLink]="['/store',store.id]" [attr.aria-label]="'Browse ' + storeName()"><svg customerIcon="arrow"></svg></a></div>
    <p>{{ store.category }}</p>
    <div class="store-meta">
      @if (store.rating > 0) {
      <span
        ><svg customerIcon="star"></svg>{{ ratingLabel() }}</span
      >
      }@if (store.eta) { <span><svg customerIcon="clock"></svg>{{ store.eta }}</span> }@if (store.distance) {
      <span><svg customerIcon="pin"></svg>{{ store.distance }}</span> }
    </div>
    @if (store.offer) {
    <p class="store-offer">
      <svg customerIcon="tag"
        ></svg>{{ store.offer }}
    </p>
    }
  </div>
</article>
