<nav class="crumb" aria-label="Breadcrumb"><a class="btn text" routerLink="/">Home</a>@for(item of items;track item.label;let last=$last){<svg customerIcon="chev"></svg>@if(!last && item.link){<a class="btn text" [routerLink]="item.link">{{ item.label }}</a>}@else{<span>{{ item.label }}</span>}}</nav>
