<footer class="site-footer">
  <div>
    <h2>
      <img
        class="footer-logo"
        src="assets/brand/nextou-logo-single.png"
        alt="Nextou logo"
      />
      <img src="assets/brand/nextou-brand-logo.png" alt="Nextou" class="brand-wordmark" />
    </h2>
    <p>Fast groceries, fresh stores, and order tracking in one place.</p>
  </div>
  @for (group of content.footerGroups(); track group.title) {
    <nav>
      <h3>{{ group.title }}</h3>
      @for (link of group.links; track link.route) {
        <a [routerLink]="link.route">{{ link.label }}</a>
      }
    </nav>
  }
</footer>
