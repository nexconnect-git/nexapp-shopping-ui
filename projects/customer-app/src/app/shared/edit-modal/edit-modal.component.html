<fd-nx-modal-shell [footer]="true" eyebrow="Edit your profile"
  [open]="!!ui.editModal()"
  title="Make yourself at home."
  subtitle="Update the details used for your customer account."
  width="490px"
  [dismissible]="!saving()"
  (closed)="close()"
  >@if(formError()){
    <div class="notice error" role="alert"><svg customerIcon="alert"></svg><div>{{ formError() }}</div></div>
    }
    <form id="customer-profile-form" class="form-grid" (submit)="save($event)" novalidate>
    <div class="field"><label for="edit-first-name">First name</label><input id="edit-first-name" name="firstName" autocomplete="given-name" [(ngModel)]="firstName" (ngModelChange)="clearFieldError('firstName')" [attr.aria-invalid]="!!fieldError('firstName')" aria-describedby="first-name-error" required maxlength="150"><small class="field-error" id="first-name-error">{{ fieldError('firstName') }}</small></div>
    <div class="field"><label for="edit-last-name">Last name</label><input id="edit-last-name" name="lastName" autocomplete="family-name" [(ngModel)]="lastName" maxlength="150"></div>
    <div class="field">
      <label for="edit-email">Email address</label
      ><input
        id="edit-email"
        name="email"
        type="email"
        autocomplete="email"
        [ngModel]="email"
        (ngModelChange)="onEmailInput($event)"
        [attr.aria-invalid]="!!fieldError('email')"
        aria-describedby="email-help email-error"
        required
      /><small id="email-help">Sign-in OTPs are delivered to your email.</small
      ><small class="field-error" id="email-error">{{
        fieldError("email")
      }}</small>
    </div>
    <div class="field">
      <label for="edit-phone">Mobile number</label
      ><input
        id="edit-phone"
        name="phone"
        type="tel"
        inputmode="tel"
        autocomplete="tel-national"
        maxlength="10"
        [ngModel]="phone"
        (ngModelChange)="onPhoneInput($event)"
        [attr.aria-invalid]="!!fieldError('phone')"
        aria-describedby="phone-help phone-error"
        required
      /><small id="phone-help"
        >A 10-digit Indian mobile number for delivery contact.</small
      ><small class="field-error" id="phone-error">{{
        fieldError("phone")
      }}</small>
    </div>
    </form>
  <p class="demo-note space">Your profile updates are saved to your account after you select Save changes.</p>
<div dialogFooter class="row wide between">
      <button class="btn" type="button" [disabled]="saving()" (click)="close()">
        Cancel</button
      ><button id="profile-save" class="btn primary" type="button" (click)="save($event)" [disabled]="saving()">
        <svg customerIcon="check"></svg>
        {{ saving() ? "Saving profile…" : "Save changes" }}
      </button>
    </div>
  </fd-nx-modal-shell
>
