@if (ui.editModal()) {
  <button
    type="button"
    class="overlay"
    aria-label="Close editor"
    (click)="ui.closeEdit()"
  ></button>
  <form class="edit-modal fd-card animate-scale" (submit)="save($event)">
    <header>
      <h2>{{ title() }}</h2>
      <button type="button" aria-label="Close editor" (click)="ui.closeEdit()">
        <span class="material-symbols-rounded">close</span>
      </button>
    </header>

    @if (ui.editModal() === "profile") {
      <label for="edit-name">Name</label
      ><input
        id="edit-name"
        class="fd-input"
        [(ngModel)]="name"
        name="name"
        placeholder="Full name"
      />
      <label for="edit-email">Email</label
      ><input
        id="edit-email"
        class="fd-input"
        [(ngModel)]="email"
        name="email"
        placeholder="Email address"
      />
      <label for="edit-phone">Phone</label
      ><input
        id="edit-phone"
        class="fd-input"
        [(ngModel)]="phone"
        name="phone"
        placeholder="Mobile number"
      />
    }

    @if (ui.editModal() === "address") {
      <label for="edit-address-label">Address Label</label
      ><input
        id="edit-address-label"
        class="fd-input"
        [(ngModel)]="addressLabel"
        name="addressLabel"
        placeholder="Home, Office, Parents Home"
      />
      <label for="edit-address-line">Full Address</label
      ><textarea
        id="edit-address-line"
        class="fd-input"
        [(ngModel)]="addressLine"
        name="addressLine"
        placeholder="House number, building, street, landmark"
      ></textarea>
      <label for="edit-address-phone">Contact Number</label
      ><input
        id="edit-address-phone"
        class="fd-input"
        [(ngModel)]="phone"
        name="addressPhone"
        placeholder="Receiver phone number"
      />
    }

    @if (ui.editModal() === "payment") {
      <label for="edit-payment-name">Card / UPI Name</label
      ><input
        id="edit-payment-name"
        class="fd-input"
        [(ngModel)]="paymentName"
        name="paymentName"
        placeholder="Payment method name"
      />
      <label for="edit-payment-id">Payment ID</label
      ><input
        id="edit-payment-id"
        class="fd-input"
        [(ngModel)]="paymentId"
        name="paymentId"
        placeholder="UPI ID or payment reference"
      />
    }

    <footer>
      <button type="button" class="fd-btn outline" (click)="ui.closeEdit()">
        Cancel
      </button>
      <button class="fd-btn primary">Save Changes</button>
    </footer>
  </form>
}
