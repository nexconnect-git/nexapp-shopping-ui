<fd-nx-modal-shell eyebrow="Delivery location" [open]="ui.locationModalOpen()"
  title="Your neighbourhood, your choice." width="490px" [footer]="true"
  subtitle="Choose a saved place or find another delivery point. A different fulfilment area may need a new basket."
  (closed)="ui.closeLocation()">
  <div class="search-field wide">
    <svg customerIcon="search"></svg>
    <input id="saved-address-search" type="search" aria-label="Search saved area or PIN"
      placeholder="Search area or PIN" [value]="query()" (input)="query.set($any($event.target).value)" />
    <button type="button" aria-label="Find another delivery area" (click)="openDeliveryArea()"><svg customerIcon="arrow"></svg></button>
  </div>
  <div class="space"><button class="btn soft wide" type="button" (click)="useCurrentLocation()"><svg customerIcon="pin"></svg>Use current location</button></div>
  <div class="divider-label">YOUR SAVED PLACES</div>
  @if(state.addressLoading()){<p role="status">Loading saved addresses…</p>}
  @if(state.addressError()){
    <div class="notice error space" role="alert"><div class="grow">{{ state.addressError() }}</div><button class="btn sm" type="button" (click)="state.loadAddresses()">Retry addresses</button></div>
  }
  @for(address of filteredAddresses();track address.id){
    <label class="choice-card" [class.selected]="isAddressSelected(address)">
      <input type="radio" name="delivery-location" [value]="address.id" [checked]="isAddressSelected(address)" (change)="chooseSaved(address)" />
      <div class="grow">
        <div class="row"><strong>{{ address.label }}</strong>@if(address.isDefault){<span class="tag neutral">Default</span>}</div>
        <p>{{ address.name }} · {{ address.phone }}<br>{{ address.line }}<br>{{ address.city }}, {{ address.state }} {{ address.pincode }}</p>
        @if(state.activeAddress()?.id===address.id && !state.serviceabilityLoading() && !state.serviceabilityError() && state.serviceability()?.is_serviceable){<p><span class="tag green">Serviceable address</span></p>}
      </div>
    </label>
  }@empty{@if(!state.addressLoading()&&!state.addressError()){<p class="small muted">No saved address matches this view.</p>}}
  <button class="btn text" type="button" (click)="openDeliveryArea()"><svg customerIcon="pin"></svg>Choose on a map</button><br>
  <button class="btn text" type="button" (click)="addAddress()"><svg customerIcon="plus"></svg>Add a saved address</button>
  <button dialogFooter class="btn primary" type="button" [disabled]="!selectedAddressId() && !state.activeAddress()?.id" (click)="save()"><svg customerIcon="arrow"></svg>Confirm delivery location</button>
</fd-nx-modal-shell>
