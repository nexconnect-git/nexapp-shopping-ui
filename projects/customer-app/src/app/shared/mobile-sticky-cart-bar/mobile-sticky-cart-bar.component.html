@if (visible && state.itemCount() > 0) {
  <aside class="mobile-sticky-cart" aria-label="Checkout shortcut">
    <a routerLink="/checkout" class="checkout-cta">
      Checkout - {{ state.total() | appCurrency }}
      <small
        >{{ state.itemCount() }}
        {{ state.itemCount() === 1 ? "item" : "items" }}</small
      >
    </a>
  </aside>
}
