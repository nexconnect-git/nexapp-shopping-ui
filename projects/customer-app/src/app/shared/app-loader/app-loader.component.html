@if (loader.loading()) {
  <div class="fd-app-loader-backdrop">
    <section class="fd-app-loader" aria-live="polite" aria-busy="true">
      <div class="fd-loader-logo material-symbols-rounded" aria-hidden="true">
        bolt
      </div>
      <div class="fd-loader-ring" aria-hidden="true"></div>
      <h1 class="fd-loader-title">FlashDrop</h1>
      <p class="fd-loader-subtitle">{{ loader.message() }}</p>
    </section>
  </div>
}
