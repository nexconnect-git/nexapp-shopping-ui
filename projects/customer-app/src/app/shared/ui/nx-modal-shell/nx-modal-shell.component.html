@if (open) {
  <div class="overlay" (click)="closed.emit()"></div>
  <section class="modal" [style.width]="width">
    <header>
      <div>
        <h2>{{ title }}</h2>
        @if (subtitle) {
          <p>{{ subtitle }}</p>
        }
      </div>
      <button type="button" aria-label="Close modal" (click)="closed.emit()">
        <span class="material-symbols-rounded">close</span>
      </button>
    </header>
    <ng-content />
  </section>
}
