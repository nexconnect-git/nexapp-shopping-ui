@if (open) {
  <button
    type="button"
    class="overlay"
    aria-label="Close modal"
    (click)="close()"
  ></button>
  <section class="modal" [style.width]="width" role="dialog" aria-modal="true" [attr.aria-label]="title">
    <header>
      <div>
        <h2>{{ title }}</h2>
        @if (subtitle) {
          <p>{{ subtitle }}</p>
        }
      </div>
      @if (dismissible) {
      <button type="button" aria-label="Close modal" (click)="close()">
        <span class="material-symbols-rounded">close</span>
      </button>
      }
    </header>
    <ng-content />
  </section>
}
