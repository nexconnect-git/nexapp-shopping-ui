@if (open) {
<div class="overlay-backdrop" (click)="onBackdropClick($event)">
  <section class="dialog" [class.center-dialog]="variant === 'center'" customerDialog [dialogBusy]="!dismissible" (dialogDismiss)="close()" [style.--dialog-width]="width" role="dialog" aria-modal="true" [attr.aria-label]="title">
    <header class="dialog-head"><div class="grow">@if(eyebrow){<div class="eyebrow">{{ eyebrow }}</div>}<h2>{{ title }}</h2></div>
      @if(dismissible){<button class="btn icon-btn" type="button" aria-label="Close modal" (click)="close()"><svg customerIcon="close"></svg></button>}
    </header>
    <div class="dialog-body">@if(subtitle){<p>{{ subtitle }}</p>}<ng-content /></div>
    @if(footer){<footer class="dialog-footer"><ng-content select="[dialogFooter]" /></footer>}
  </section>
</div>
}
