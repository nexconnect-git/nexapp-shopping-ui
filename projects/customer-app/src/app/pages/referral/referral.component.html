<main class="fd-content">
  <section class="referral">
    <div class="hero">
      <div>
        <h1>{{ content.referral().title }} {{ 100 | appCurrency }}</h1>
        <p>{{ content.referral().subtitle }}</p>
        <button type="button" class="fd-btn primary" (click)="copy()">
          {{ content.referral().ctaLabel }}
        </button>
      </div>
      <span class="material-symbols-rounded">redeem</span>
    </div>
    <section class="fd-card code">
      <small>{{ content.referral().codeTitle }}</small>
      <h2>{{ code() || "Not available" }}</h2>
      <button type="button" (click)="copy()">Tap to copy</button>
    </section>
    <section class="share-grid">
      <button type="button" (click)="share('WhatsApp')">WhatsApp</button
      ><button type="button" (click)="share('Telegram')">Telegram</button
      ><button type="button" (click)="share('Share')">Share</button
      ><button type="button" (click)="share('More')">More</button>
    </section>
    <section class="fd-card rewards">
      <small>{{ content.referral().rewardsTitle }}</small>
      <h2>{{ rewardAmount() | appCurrency }}</h2>
      <p>{{ content.referral().rewardsSubtitle }}</p>
    </section>
  </section>
</main>
