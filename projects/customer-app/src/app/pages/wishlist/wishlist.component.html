<main class="fd-content">
  <fd-breadcrumbs [items]="[{ label: 'Wishlist' }]" />
  <section class="wishlist">
    <h1 class="fd-title">Wishlist</h1>
    <section class="product-grid">
      @for (product of items(); track product.id) {
        <div class="wish-wrap">
          <button
            type="button"
            (click)="remove(product.id)"
            class="heart"
            aria-label="Remove from wishlist"
          >
            <span class="material-symbols-rounded">favorite</span></button
          ><fd-product-card [product]="product" />
        </div>
      } @empty {
        <section class="fd-card empty">
          <h2>No saved items yet</h2>
          <p>Add products to your wishlist from product pages.</p>
        </section>
      }
    </section>
  </section>
</main>
